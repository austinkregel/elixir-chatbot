services:
  db:
    image: apache/age
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat_bot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-chat_bot_dev}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chat_bot}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
