name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "28"
  # config/runtime.exs requires these for every mix invocation that loads
  # app config; jobs that hit the database also run the apache/age service.
  POSTGRES_USER: chat_bot
  POSTGRES_PASSWORD: chat_bot_dev
  POSTGRES_DB: chat_bot_dev
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  # The Ouro sidecar runs a 2.6B-parameter PyTorch model — far too heavy for
  # hosted runners. Skips sidecar startup and :requires_ouro tests.
  OURO_ENABLED: "false"

jobs:
  # Compile and check for warnings
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

  # Check code formatting
  format:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

  # Check for unused dependencies
  deps:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused
  # Verify ML-based approach (no string matching in event code)
  verify-ml:
    name: Verify ML Approach
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify no string matching in event extraction
        run: ./scripts/verify_no_string_matching.sh


  # Check LSTM model compatibility before running tests
  lstm-compatibility:
    name: LSTM Model Compatibility
    runs-on: ubuntu-latest
    outputs:
      models_compatible: ${{ steps.check.outputs.compatible }}
    services:
      db:
        image: apache/age
        env:
          POSTGRES_USER: chat_bot
          POSTGRES_PASSWORD: chat_bot_dev
          POSTGRES_DB: chat_bot_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_bot -d chat_bot_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Create database
        run: mix ecto.create

      - name: Check LSTM model compatibility
        id: check
        run: |
          echo "Checking LSTM model compatibility..."
          if mix regenerate_test_models --check 2>&1 | grep -q "INCOMPATIBLE"; then
            echo "compatible=false" >> $GITHUB_OUTPUT
            echo "::warning::LSTM models are incompatible with current library versions. Run 'mix regenerate_test_models --all' to fix."
          else
            echo "compatible=true" >> $GITHUB_OUTPUT
            echo "LSTM models are compatible"
          fi

      - name: Display library versions
        run: |
          echo "=== ML Library Versions ==="
          mix run --no-start -e 'Application.load(:nx); IO.inspect(Application.spec(:nx, :vsn), label: "Nx")'
          mix run --no-start -e 'Application.load(:axon); IO.inspect(Application.spec(:axon, :vsn), label: "Axon")'
          mix run --no-start -e 'IO.inspect(System.otp_release(), label: "OTP")'
          echo "==========================="

  # Run all tests with coverage
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [compile, lstm-compatibility]
    services:
      db:
        image: apache/age
        env:
          POSTGRES_USER: chat_bot
          POSTGRES_PASSWORD: chat_bot_dev
          POSTGRES_DB: chat_bot_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_bot -d chat_bot_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Create database
        run: mix ecto.create

      - name: Bootstrap AGE and migrate test schema
        run: |
          mix atlas.bootstrap_age
          mix atlas.migrate_test

      - name: Download WordNet data
        run: mix download_wordnet

      - name: Build test gazetteer
        run: mix ensure_gazetteer

      # Feature-vector micro-classifiers train from data/classifiers/*.json
      # (115MB, gitignored). Generating them runs the full analysis pipeline
      # over the gold standard, so cache the result keyed on its content.
      - name: Restore micro-classifier training data
        uses: actions/cache@v4
        with:
          path: data/classifiers
          key: micro-data-${{ hashFiles('apps/brain/priv/evaluation/intent/gold_standard.json') }}

      - name: Generate micro-classifier training data
        run: test -f data/classifiers/intent_full.json || mix gen_micro_data

      - name: Run LSTM compatibility tests first
        run: mix test apps/brain/test/brain/ml/lstm/model_compatibility_test.exs --trace

      - name: Run tests (excluding LSTM-dependent if models incompatible)
        run: |
          if [ "${{ needs.lstm-compatibility.outputs.models_compatible }}" = "false" ]; then
            echo "::warning::Running tests with --exclude requires_lstm due to model incompatibility"
            mix test --cover --exclude requires_lstm
          else
            mix test --cover
          fi

      - name: Generate coverage report
        run: mix coveralls.json
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cover/excoveralls.json
          fail_ci_if_error: false
        continue-on-error: true

  # Build assets to ensure they compile correctly
  assets:
    name: Assets Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Build assets
        run: mix assets.build
